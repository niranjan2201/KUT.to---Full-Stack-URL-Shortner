spring.application.name=backend
server.port=8098

spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true


jwt.secret=${JWT_SECRET}
jwt.expiration=172800000


# Mail-Functionality:

spring.mail.host=${EMAIL_HOST}
spring.mail.port=587
spring.mail.username=${EMAIL_TEMP_USERNAME}
spring.mail.password=${EMAIL_TEMP_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.protocols=smtp

spring.mail.properties.mail.smtp.from=${EMAIL_FROM}
app.mail.fromName=KUT.to

frontend.url=${FRONTEND_URL}

